version: '3.9'

services:
  subframe-dashboard:
    image: latifulanwar/subframe-dashboard
    expose:
      - "3000"
    volumes:
      - ./public:/app/public
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - subframe-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - subframe-dashboard
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    networks:
      - subframe-network

volumes:
  public:
    driver: local
    
networks:
  subframe-network:
    driver: bridge